[project]
name = "simulacao-tigrinho"
version = "1.0.0"
description = "10 mil jogadores num caça-níquel de teste: quanto a casa fica, quantos saem no lucro e por quê."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
